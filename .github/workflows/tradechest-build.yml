name: Trade Chest Build Test
on:
  push:
    branches: [tradechest-build-26.2]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Restore project
        shell: bash
        run: |
          mkdir tc
          base64 -d tradechest-build/project.zip.b64 > tc/project.zip
          unzip -q tc/project.zip -d tc
      - name: Build
        working-directory: tc/trade-chest-fabric-26.2
        run: gradle build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: trade-chest-jar
          path: tc/trade-chest-fabric-26.2/build/libs/trade-chest-1.1.0.jar
