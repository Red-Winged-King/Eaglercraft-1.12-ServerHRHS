name: Trade Chest Build Test
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Restore project
        shell: bash
        run: |
          mkdir -p tc
          cat tradechest-build/parts/* > tc/project.zip.b64
          base64 -d tc/project.zip.b64 > tc/project.zip
          unzip -q tc/project.zip -d tc
          test -f tc/trade-chest-fabric-26.2/build.gradle
          sed -i 's/modImplementation "eu.pb4:polymer-core:/implementation "eu.pb4:polymer-core:/' tc/trade-chest-fabric-26.2/build.gradle
          sed -i 's/method = "notifyTrade", at = @At("TAIL")/method = "rewardTradeXp", at = @At("TAIL")/' tc/trade-chest-fabric-26.2/src/main/java/dev/tradechest/mixin/VillagerUnlimitedTradingMixin.java
      - name: Build
        working-directory: tc/trade-chest-fabric-26.2
        run: gradle build --stacktrace
      - name: Dedicated server smoke test
        working-directory: tc/trade-chest-fabric-26.2
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nserver-port=25567\n' > run/server.properties
          set +e
          timeout 120s gradle runServer --stacktrace > server-smoke.log 2>&1
          status=$?
          set -e
          cat server-smoke.log
          if grep -q "Done (" server-smoke.log; then
            echo "Dedicated Fabric server reached ready state."
            exit 0
          fi
          echo "Server failed to reach ready state; timeout/status=$status"
          exit 1
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: trade-chest-jar
          path: tc/trade-chest-fabric-26.2/build/libs/trade-chest-1.1.0.jar
